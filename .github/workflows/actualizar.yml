# Guardar este archivo en el repo como: .github/workflows/actualizar.yml
name: Actualizar monitor Mercado Público

on:
  workflow_dispatch:          # botón manual "Run workflow"
  schedule:
    - cron: "37 8 * * 1-5"    # 05:37 Chile — principal
    - cron: "19 11 * * 1-5"   # 08:19 Chile — respaldo
    - cron: "20 13 * * 1-5"   # 10:20 Chile — PRUEBA de hoy (borrar luego)

permissions:
  contents: write

concurrency:
  group: monitor-mp
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests pandas matplotlib openpyxl pillow

      - name: Ejecutar monitor
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
        run: python monitor_mp.py

      - name: Publicar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git commit -m "Actualización monitor $(date -u +'%Y-%m-%d %H:%M UTC')"; then
            # Sincronizar con el remoto DESPUÉS de commitear; ante conflictos
            # en docs/ ganan los archivos recién generados (-X theirs)
            git pull --rebase -X theirs origin main
            git push origin main
          else
            echo "Sin cambios que publicar"
          fi
